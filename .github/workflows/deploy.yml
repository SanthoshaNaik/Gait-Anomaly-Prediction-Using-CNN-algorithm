name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Replace 'SanthoshhNaik' and 'Gait-Anomaly-Prediction-Using-CNN-algorithm' below 
          # if your Hugging Face username or Space name is different.
          git push --force https://SanthoshhNaik:$HF_TOKEN@huggingface.co/spaces/SanthoshhNaik/Gait-Anomaly-Prediction-Using-CNN-algorithm main

